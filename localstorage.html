<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Local Storage Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: auto;
      padding: 20px;
      background-color: #eaffea;
      text-align: center;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 90%;
    }
    button {
      padding: 12px;
      width: 95%;
      background-color: #2d7f2f;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
    }
    .box {
      background-color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h2>Save Your Info</h2>
  <input type="email" id="email" placeholder="Enter email">
  <input type="number" id="score" placeholder="Enter your score">
  <button onclick="saveInfo()">Save Info</button>

  <div class="box">
    <h3>Saved Info:</h3>
    <p id="displayEmail">Email: —</p>
    <p id="displayScore">Score: —</p>
  </div>

  <button onclick="clearInfo()">Clear Storage</button>

  <script>
    function saveInfo() {
      const email = document.getElementById("email").value;
      const score = document.getElementById("score").value;

      // Save to localStorage
      localStorage.setItem("userEmail", email);
      localStorage.setItem("userScore", score);

      showInfo();
    }

    function showInfo() {
      const email = localStorage.getItem("userEmail") || "—";
      const score = localStorage.getItem("userScore") || "—";

      document.getElementById("displayEmail").innerText = "Email: " + email;
      document.getElementById("displayScore").innerText = "Score: " + score;
    }

    function clearInfo() {
      localStorage.removeItem("userEmail");
      localStorage.removeItem("userScore");
      showInfo();
    }

    // Load stored info on page load
    window.onload = showInfo;
  </script>

</body>
</html>
