<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerminoTech – COC 2 Dictionary</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fff0;
      text-align: center;
      padding: 24px;
      margin: auto;
      max-width: 480px;
      animation: fadeIn 0.5s ease-in-out;
    }

    h1 {
      color: #0b6b0b;
      margin-bottom: 20px;
      animation: slideDown 0.6s ease-in-out;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 6px auto;
      width: 90%;
      max-width: 340px;
      display: block;
      border-radius: 5px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background-color: #0a6c0a;
      color: white;
      border: none;
      transition: transform 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: scale(1.03);
      background-color: #095b09;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #output {
      margin-top: 20px;
      font-size: 16px;
      text-align: left;
      background: #dfffdc;
      padding: 12px;
      border-radius: 6px;
      animation: fadeIn 0.4s ease-in-out;
    }

    #listBox {
      display: none;
      text-align: left;
      margin-top: 20px;
      background: #ebffeb;
      padding: 12px;
      border-radius: 6px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      font-size: 15px;
    }

    li {
      padding: 6px 0;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-15px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<h1>TerminoTech – COC 2 Translator</h1>

<input id="termInput" type="text" placeholder="Enter a COC 2 term..." />
<button id="translateBtn">Translate</button>
<button id="speakBtn" disabled>Pronounce</button>
<button id="favoriteBtn" disabled>Add to Favorites</button>
<button id="listBtn">List of Terms</button>
<button class="btn" onclick="window.location.href='coc selection.html'">back</button>
<div id="output"></div>
<div id="listBox"></div>

<script>
  const terms = {
    "Command Prompt": { full: "CMD", meaning: "A command‑line interpreter used to execute commands in Windows." },
    "PowerShell": { full: "Windows PowerShell", meaning: "Advanced command shell and scripting language for task automation." },
    "Disk Management": { full: "Disk Partition Tool", meaning: "Utility for creating, deleting and formatting partitions." },
    "System Restore": { full: "Windows Recovery Tool", meaning: "Restores system files and settings to an earlier point in time." },
    "Device Manager": { full: "Hardware Manager", meaning: "Displays hardware devices and allows driver management." },
    "Safe Mode": { full: "Diagnostic Boot Mode", meaning: "Starts Windows with minimal drivers to help troubleshoot issues." },
    "CHKDSK": { full: "Check Disk", meaning: "Scans file system and repairs logical disk errors." },
    "SFC": { full: "System File Checker", meaning: "Scans and restores corrupted Windows system files." },
    "Bootrec": { full: "Boot Recovery Tool", meaning: "Repairs MBR, boot sector and BCD store." },
    "Task Manager": { full: "Process Monitor", meaning: "Monitors running apps, background processes and resource usage." },
    "Startup Repair": { full: "Automatic Repair Tool", meaning: "Fixes problems preventing Windows from booting." },
    "Registry Editor": { full: "Regedit", meaning: "Tool for viewing and editing the Windows Registry." },
    "BIOS Update": { full: "Firmware Upgrade", meaning: "Updates motherboard firmware for stability and new features." },
    "System Image Recovery": { full: "Windows Backup Restore", meaning: "Restores an entire system from a disk image." },
    "Partition": { full: "Disk Partition", meaning: "Logical division of a storage device into isolated sections." },
    "MBR": { full: "Master Boot Record", meaning: "First sector of a drive containing bootloader and partition table." },
    "UEFI": { full: "Unified Extensible Firmware Interface", meaning: "Modern replacement for BIOS with faster boot and secure boot." },
    "Dual Boot": { full: "Multi‑OS Setup", meaning: "Configuration that lets you choose between two operating systems at startup." },
    "Virtual Machine": { full: "VM", meaning: "Software emulation of a computer system running an OS." },
    "Hyper‑V": { full: "Microsoft Virtualization Platform", meaning: "Native hypervisor for creating and managing virtual machines." },
    "Multimeter": { full: "Digital Multimeter", meaning: "Measures voltage, current and resistance when servicing hardware." },
    "Cable Tester": { full: "LAN Cable Tester", meaning: "Verifies wiring and continuity of network cables." },
    "Screwdriver": { full: "Precision Screwdriver", meaning: "Used to open, assemble or replace PC components." }
  };

  const lookup = {};
  for (const key in terms) {
    lookup[key.toUpperCase()] = { alias: key, ...terms[key] };
    lookup[terms[key].full.toUpperCase()] = { alias: key, ...terms[key] };
  }

  const termInput    = document.getElementById("termInput");
  const translateBtn = document.getElementById("translateBtn");
  const speakBtn     = document.getElementById("speakBtn");
  const listBtn      = document.getElementById("listBtn");
  const favoriteBtn  = document.getElementById("favoriteBtn");
  const outputDiv    = document.getElementById("output");
  const listBox      = document.getElementById("listBox");

  let currentTerm = "", currentFull = "";

  translateBtn.addEventListener("click", () => {
    const raw = termInput.value.trim();
    if (!raw) return;
    const item = lookup[raw.toUpperCase()];
    if (!item) {
      outputDiv.innerHTML = "<span style='color:red'>Term not found.</span>";
      speakBtn.disabled = true;
      favoriteBtn.disabled = true;
      return;
    }
    currentTerm = item.alias;
    currentFull = item.full;
    outputDiv.innerHTML = `<strong>${item.alias}</strong><br><em>${item.full}</em><br>${item.meaning}`;
    speakBtn.disabled = false;
    favoriteBtn.disabled = false;
  });

  termInput.addEventListener("keyup", e => {
    if (e.key === "Enter") translateBtn.click();
  });

  speakBtn.addEventListener("click", () => {
    if (!currentFull) return;
    speechSynthesis.speak(new SpeechSynthesisUtterance(currentFull));
  });

listBtn.addEventListener("click", () => {
  window.location.href = "COC 2 DICTIONARY.html";
});

  favoriteBtn.addEventListener("click", () => {
    if (!currentTerm) return;
    const favs = JSON.parse(localStorage.getItem("favorites")) || [];
    if (!favs.includes(currentTerm)) favs.push(currentTerm);
    localStorage.setItem("favorites", JSON.stringify(favs));
    window.location.href = "Favoritelist.html";
  });
</script>

</body>
</html>
