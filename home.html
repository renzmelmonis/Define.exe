<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome - TerminoTech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eaffea;
      padding: 30px 20px;
      text-align: center;
      max-width: 480px;
      margin: auto;
      animation: fadeIn 1s ease-in;
    }

    h2 {
      animation: slideDown 0.8s ease-in-out;
    }

    p {
      animation: slideDown 1s ease-in-out;
    }

    .btn {
      background-color: green;
      color: white;
      padding: 12px 25px;
      border: none;
      margin: 15px auto;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.2s ease;
      display: block;
      animation: fadeIn 1s ease-in-out 0.5s forwards;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .feature {
      margin: 20px auto;
      max-width: 90%;
      text-align: left;
      padding: 15px;
      background-color: #f0fff0;
      border-radius: 10px;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      opacity: 0;
      animation: fadeInUp 0.8s ease-in-out forwards;
    }

    .feature:hover {
      transform: scale(1.02);
      background-color: #dbffdb;
    }

    .icon {
      font-size: 26px;
      display: inline-block;
      width: 40px;
      vertical-align: top;
    }

    .logo {
      width: 90px;
      position: fixed;
      bottom: 15px;
      right: 15px;
      animation: fadeIn 1s ease-in-out 1s forwards;
    }

    .logout-btn {
      background-color: #ff4d4d;
      color: white;
      padding: 10px 20px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .logout-btn:hover {
      background-color: #cc0000;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h2>Welcome to <strong>TerminoTech</strong></h2>
  <p>An online resource for ICT terms</p>

  <!-- MAIN BUTTON -->
  <button class="btn" onclick="window.location.href='coc selection.html'">Get Started</button>

  <!-- FEATURES (Clickable Boxes) -->
  <div class="feature" onclick="window.location.href='search.html'">
    <span class="icon">🔍</span>
    <strong>Search Terms</strong><br>
    Quickly find definitions for ICT-related terms.
  </div>

  <div class="feature" onclick="window.location.href='Favoritelist.html'">
    <span class="icon">🔖</span>
    <strong>Bookmark Favorites</strong><br>
    Save your frequently used terms.
  </div>

  <div class="feature" onclick="window.location.href='mini quiz.html'">
    <span class="icon">🎮</span>
    <strong>Mini Quiz</strong><br>
    Test your knowledge with fun quizzes.
  </div>

  <!-- LOGOUT BUTTON -->
  <button class="logout-btn" onclick="logout()">Logout</button>

  <img src="OC LOGO.jpg" alt="School Logo" class="logo">

  <script>
    function logout() {
      localStorage.removeItem("terminotech_user");
      window.location.href = "log in.html"; // ← make sure this filename is correct
    }
  </script>
</body>
</html>
