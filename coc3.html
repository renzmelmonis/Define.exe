<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TerminoTech – COC 3 Dictionary</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fff0;
      text-align: center;
      padding: 24px;
      margin: auto;
      max-width: 480px;
      animation: fadeIn 0.5s ease-in-out;
    }

    h1 {
      color: #0b6b0b;
      margin-bottom: 20px;
      animation: slideDown 0.6s ease-in-out;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 6px auto;
      width: 90%;
      max-width: 340px;
      display: block;
      border-radius: 5px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background-color: #0a6c0a;
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: scale(1.03);
      background-color: #095b09;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #output {
      margin-top: 20px;
      font-size: 16px;
      text-align: left;
      background: #dfffdc;
      padding: 12px;
      border-radius: 6px;
      animation: fadeIn 0.4s ease-in-out;
    }

    #listBox {
      display: none;
      text-align: left;
      margin-top: 20px;
      background: #ebffeb;
      padding: 12px;
      border-radius: 6px;
      max-height: 420px;
      overflow-y: auto;
    }

    ul {
      list-style-type: none;
      padding: 0;
      font-size: 15px;
    }

    li {
      padding: 6px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-15px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<h1>TerminoTech – COC 3 Translator</h1>

<input id="termInput" type="text" placeholder="Enter a COC 3 term..." />
<button id="translateBtn">Translate</button>
<button id="speakBtn" disabled>Pronounce</button>
<button id="favoriteBtn" disabled>Add to Favorites</button>
<button id="listBtn">List of Terms</button>
<button class="btn" onclick="window.location.href='coc selection.html'">back</button>

<div id="output"></div>
<div id="listBox"></div>

<script>
const terms = {
  "HTML5": { full:"HTML5", meaning:"Latest major version of HTML introducing semantic tags, audio/video elements, and Canvas." },
  "CSS3": { full:"CSS3", meaning:"Latest CSS specification with features like Flexbox, Grid, animations and variables." },
  "SVG": { full:"Scalable Vector Graphics", meaning:"XML-based vector image format for sharp graphics at any resolution." },
  "Canvas": { full:"HTML Canvas", meaning:"Bitmap drawing area in HTML5 used for 2‑D games, graphs, and image editing." },
  "WebGL": { full:"Web Graphics Library", meaning:"JavaScript API for rendering interactive 3‑D graphics in the browser using GPU." },
  "React": { full:"React JS", meaning:"JavaScript library for building user interfaces with components and virtual DOM." },
  "Angular": { full:"Angular Framework", meaning:"Google‑maintained TypeScript framework for large‑scale web apps." },
  "Vue": { full:"Vue JS", meaning:"Progressive JavaScript framework focused on the view layer and reactivity." },
  "Bootstrap": { full:"Bootstrap CSS Framework", meaning:"Popular CSS & JS toolkit for responsive, mobile‑first websites." },
  "Tailwind": { full:"Tailwind CSS", meaning:"Utility‑first CSS framework for rapidly building custom designs." },
  "SASS": { full:"Syntactically Awesome Style Sheets", meaning:"CSS pre‑processor adding variables, nesting, mixins and functions." },
  "LESS": { full:"Leaner Style Sheets", meaning:"CSS pre‑processor with variables and modularization." },
  "TypeScript": { full:"TypeScript", meaning:"Superset of JavaScript adding static types and modern syntax." },
  "Node.js": { full:"Node JavaScript Runtime", meaning:"Server‑side JavaScript runtime built on Chrome's V8 engine." },
  "Express": { full:"Express JS", meaning:"Minimal Node.js web application framework for APIs and servers." },
  "REST API": { full:"Representational State Transfer API", meaning:"Architectural style for stateless web services using HTTP methods." },
  "JSON": { full:"JavaScript Object Notation", meaning:"Lightweight data‑interchange format easy for humans and machines to read/write." },
  "AJAX": { full:"Asynchronous JavaScript and XML", meaning:"Technique to fetch data in the background without reloading a page." },
  "Fetch API": { full:"Fetch API", meaning:"Modern JavaScript interface for making HTTP requests and handling promises." },
  "Git": { full:"Git Version Control", meaning:"Distributed version‑control system for tracking code changes." },
  "GitHub": { full:"GitHub Platform", meaning:"Cloud service for hosting Git repositories and collaboration." },
  "GitLab": { full:"GitLab Platform", meaning:"DevOps lifecycle tool providing Git hosting and CI/CD pipelines." },
  "Branch": { full:"Git Branch", meaning:"Parallel line of development in a Git repository." },
  "Commit": { full:"Git Commit", meaning:"Snapshot of changes saved to a Git repository history." },
  "Merge": { full:"Git Merge", meaning:"Combines changes from different branches into one." },
  "Pull Request": { full:"Merge Request", meaning:"Proposal to merge code into a branch, enabling review and discussion." },
  "Docker": { full:"Docker Container Platform", meaning:"Tool for packaging applications and dependencies into portable containers." },
  "Container": { full:"Software Container", meaning:"Isolated runtime environment that bundles application code with its libraries." },
  "Kubernetes": { full:"Kubernetes", meaning:"Open‑source system for automating deployment, scaling, and management of containerized apps." },
  "CI/CD": { full:"Continuous Integration / Continuous Deployment", meaning:"Practices that automate testing and deployment of code." },
  "Webpack": { full:"Webpack Module Bundler", meaning:"Build tool that bundles JavaScript, CSS, images into optimized assets." },
  "Babel": { full:"Babel Transpiler", meaning:"JavaScript compiler that converts modern JS/TS into browser‑compatible code." },
  "NPM": { full:"Node Package Manager", meaning:"Default package manager for Node.js ecosystems." },
  "Yarn": { full:"Yarn Package Manager", meaning:"Fast, secure JavaScript package manager alternative to NPM." },
  "package.json": { full:"Node Package Manifest", meaning:"File listing project metadata, dependencies, and scripts for Node projects." },
  "Figma": { full:"Figma Design Tool", meaning:"Browser‑based UI/UX design and prototyping platform for collaborative work." },
  "Adobe XD": { full:"Adobe Experience Design", meaning:"Vector‑based UI/UX design and prototyping tool by Adobe." },
  "Photoshop": { full:"Adobe Photoshop", meaning:"Industry‑standard raster graphics editor for images and digital art." },
  "Illustrator": { full:"Adobe Illustrator", meaning:"Vector graphics editor used for logos, icons, and illustrations." },
  "Premiere Pro": { full:"Adobe Premiere Pro", meaning:"Professional video editing software." },
  "After Effects": { full:"Adobe After Effects", meaning:"Software for motion graphics and visual effects." },
  "MP4": { full:"MPEG‑4 Part 14", meaning:"Digital multimedia container format for storing video and audio." },
  "PNG": { full:"Portable Network Graphics", meaning:"Raster image format supporting transparency and lossless compression." },
  "JPEG": { full:"Joint Photographic Experts Group", meaning:"Common lossy image format balancing quality and size." },
  "GIF": { full:"Graphics Interchange Format", meaning:"Image format supporting 256 colors and simple animations." },
  "SVG (File)": { full:"Scalable Vector Graphics File", meaning:"Vector image file rendered via XML; ideal for icons and logos." },
  "MP3": { full:"MPEG‑1 Audio Layer III", meaning:"Popular lossy audio format (music, podcasts)." },
  "WAV": { full:"Waveform Audio File Format", meaning:"Uncompressed audio format with high fidelity." },
  "OGG": { full:"Ogg Vorbis", meaning:"Open, patent‑free container often used for Vorbis audio." },
  "Codec": { full:"Coder‑Decoder", meaning:"Software or hardware that compresses/decompresses audio or video." },
  "FPS": { full:"Frames Per Second", meaning:"Number of frames displayed each second in video or animation." },
  "Resolution": { full:"Pixel Dimensions", meaning:"Number of pixels in each dimension that can be displayed." },
  "Aspect Ratio": { full:"Width‑to‑Height Ratio", meaning:"Proportional relationship between width and height of media." },
  "Wireframe": { full:"UI Wireframe", meaning:"Basic schematic layout of a web page or app screen." },
  "Mockup": { full:"Design Mock‑up", meaning:"High‑fidelity static design showing final look before coding." },
  "Prototype": { full:"Interactive Prototype", meaning:"Clickable model simulating user flow for testing UX." }
};

const lookup = {};
for (const key in terms) {
  lookup[key.toUpperCase()] = { alias: key, ...terms[key] };
  lookup[terms[key].full.toUpperCase()] = { alias: key, ...terms[key] };
}

const termInput   = document.getElementById("termInput");
const translateBtn= document.getElementById("translateBtn");
const speakBtn    = document.getElementById("speakBtn");
const listBtn     = document.getElementById("listBtn");
const favoriteBtn = document.getElementById("favoriteBtn");
const outputDiv   = document.getElementById("output");
const listBox     = document.getElementById("listBox");

let currentTerm="", currentFull="";

translateBtn.addEventListener("click", () => {
  const raw = termInput.value.trim();
  if (!raw) return;
  const item = lookup[raw.toUpperCase()];
  if (!item) {
    outputDiv.innerHTML = "<span style='color:red'>Term not found.</span>";
    speakBtn.disabled = true; favoriteBtn.disabled = true; return;
  }
  currentTerm = item.alias; currentFull = item.full;
  outputDiv.innerHTML = `<strong>${item.alias}</strong><br><em>${item.full}</em><br>${item.meaning}`;
  speakBtn.disabled = false; favoriteBtn.disabled = false;
});
termInput.addEventListener("keyup", e => { if (e.key==="Enter") translateBtn.click(); });

speakBtn.addEventListener("click", () => {
  if (!currentFull) return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(currentFull));
});

listBtn.addEventListener("click", () => {
  window.location.href = "COC 3 DICTIONARY.html";
});

favoriteBtn.addEventListener("click", () => {
  if (!currentTerm) return;
  const favs = JSON.parse(localStorage.getItem("favorites")) || [];
  if (!favs.includes(currentTerm)) favs.push(currentTerm);
  localStorage.setItem("favorites", JSON.stringify(favs));
  window.location.href = "Favoritelist.html";
});
</script>

</body>
</html>
