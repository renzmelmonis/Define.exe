<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TerminoTech – COC 1 Dictionary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fff0;
      text-align: center;
      padding: 24px;
      margin: auto;
      max-width: 480px;
      animation: fadeIn 0.5s ease-in-out;
    }

    h1 {
      color: #0b6b0b;
      margin-bottom: 20px;
      animation: slideDown 0.6s ease-in-out;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 6px auto;
      width: 90%;
      max-width: 340px;
      display: block;
      border-radius: 5px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background-color: #0a6c0a;
      color: white;
      border: none;
      transition: transform 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: scale(1.03);
      background-color: #095b09;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #output {
      margin-top: 20px;
      font-size: 16px;
      text-align: left;
      background: #dfffdc;
      padding: 12px;
      border-radius: 6px;
      animation: fadeIn 0.5s ease-in-out;
    }

    #listBox {
      display: none;
      text-align: left;
      margin-top: 20px;
      background: #ebffeb;
      padding: 12px;
      border-radius: 6px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      font-size: 15px;
    }

    li {
      padding: 6px 0;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-15px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<h1>TerminoTech – COC 1 Translator</h1>

<input id="termInput" type="text" placeholder="Enter a COC 1 term..." />
<button id="translateBtn">Translate</button>
<button id="speakBtn" disabled>Pronounce</button>
<button id="favoriteBtn" disabled>Add to Favorites</button>
<button id="listBtn">List of Terms</button>
<button class="btn" onclick="window.location.href='coc selection.html'">back</button>

<div id="output"></div>
<div id="listBox"></div>

<script>
  const terms = {
    "HTML": { full:"HyperText Markup Language", meaning:"A markup language used to structure content on the web. It defines elements like headings, paragraphs, and links." },
    "CSS": { full:"Cascading Style Sheets", meaning:"Used to style and layout web pages. It controls colors, fonts, and responsive designs." },
    "JavaScript": { full:"JavaScript", meaning:"A programming language used to make web pages interactive (like buttons, sliders, and forms)." },
    "Multimeter": { full:"Digital Multimeter", meaning:"A tool used to measure voltage, current, and resistance. Essential in diagnosing electrical issues in computers." },
    "Screwdriver": { full:"Precision Screwdriver", meaning:"Used to open and assemble parts of computer hardware during repair and maintenance." },
    "LAN Cable": { full:"Ethernet Cable", meaning:"Used to connect computers to a network for internet access or local data sharing." },
    "Router": { full:"Network Router", meaning:"Distributes internet connections to multiple devices via LAN or Wi‑Fi." },
    "IP Address": { full:"Internet Protocol Address", meaning:"A unique number assigned to each device connected to a network." },
    "BIOS": { full:"Basic Input Output System", meaning:"The firmware that starts up your PC and prepares hardware before the OS loads." },
    "RAM": { full:"Random Access Memory", meaning:"Temporary memory used to store data the computer is currently using. More RAM means better multitasking." },
    "CPU": { full:"Central Processing Unit", meaning:"The brain of the computer that processes instructions from programs and software." },
    "Motherboard": { full:"Main Circuit Board", meaning:"Holds and connects all the major components of the computer like CPU, RAM, and storage." },
    "PSU": { full:"Power Supply Unit", meaning:"Converts electricity from a wall outlet into power the computer can use safely." },
    "HDD": { full:"Hard Disk Drive", meaning:"A storage device that holds data permanently, such as the operating system and files." },
    "SSD": { full:"Solid State Drive", meaning:"A faster storage device than HDD, with no moving parts. Improves boot and load times." },
    "Antistatic Wrist Strap": { full:"Grounding Wrist Strap", meaning:"Worn to prevent electrostatic discharge that could damage computer components during repair." },
    "Software": { full:"Application Software", meaning:"Programs installed on a computer, like browsers, word processors, or games." },
    "Hardware": { full:"Physical Components", meaning:"The physical parts of a computer like the monitor, keyboard, motherboard, and hard drive." },
    "Firewall": { full:"Security System", meaning:"Protects computers from unauthorized access by monitoring and controlling network traffic." },
    "Ping": { full:"Packet Internet Groper", meaning:"A command used to test the speed or connectivity between two network devices." }
  };

  const lookup = {};
  for (const k in terms) {
    lookup[k.toUpperCase()] = k;
    lookup[terms[k].full.toUpperCase()] = k;
  }

  const termInput    = document.getElementById("termInput");
  const translateBtn = document.getElementById("translateBtn");
  const speakBtn     = document.getElementById("speakBtn");
  const listBtn      = document.getElementById("listBtn");
  const favoriteBtn  = document.getElementById("favoriteBtn");
  const outputDiv    = document.getElementById("output");
  const listBox      = document.getElementById("listBox");

  let currentTerm = "", currentFull = "";

  translateBtn.addEventListener("click", () => {
    const raw = termInput.value.trim();
    if (!raw) return;
    const alias = lookup[raw.toUpperCase()];
    if (!alias) {
      outputDiv.innerHTML = "<span style='color:red'>Term not found.</span>";
      speakBtn.disabled = true;
      favoriteBtn.disabled = true;
      return;
    }
    const data = terms[alias];
    currentTerm = alias;
    currentFull = data.full;
    outputDiv.innerHTML = `<strong>${alias}</strong><br><em>${data.full}</em><br>${data.meaning}`;
    speakBtn.disabled = false;
    favoriteBtn.disabled = false;
  });

  termInput.addEventListener("keyup", e => {
    if (e.key === "Enter") translateBtn.click();
  });

  speakBtn.addEventListener("click", () => {
    if (!currentFull) return;
    const utter = new SpeechSynthesisUtterance(currentFull);
    utter.lang = "en-US";
    speechSynthesis.speak(utter);
  });

  listBtn.addEventListener("click", () => {
  window.location.href = "COC 1 DICTIONARY.html";
});

  favoriteBtn.addEventListener("click", () => {
    if (!currentTerm) return;
    let favs = JSON.parse(localStorage.getItem("favorites")) || [];
    if (!favs.includes(currentTerm)) favs.push(currentTerm);
    localStorage.setItem("favorites", JSON.stringify(favs));
    window.location.href = "Favoritelist.html";
  });
</script>

</body>
</html>
